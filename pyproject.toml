[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codex-ai-engineering-os"
version = "1.0.0"
description = "Codex engineering governance layer: three stateless gates, worktrees, and memory"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.scripts]
codex-os = "codex_ai_os.cli.app:main"

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "hatchling>=1.27,<2",
  "pyright[nodejs]>=1.1.403,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_ai_os"]

[tool.hatch.build.targets.sdist]
include = [
  "src/codex_ai_os",
  "tests",
  "docs",
  "plugins",
  "pyproject.toml",
  "uv.lock",
  "README.md",
  "AGENTS.md",
  ".python-version",
  ".gitignore",
]
exclude = [
  ".codex-os",
  ".worktrees",
  "dist",
  ".venv",
  ".pytest_cache",
  ".ruff_cache",
  "__pycache__",
  ".coverage",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["codex_ai_os"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/codex_ai_os/templates/*.py" = ["E501", "RUF001"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.uv]
package = true
