[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codex-ai-engineering-os"
version = "0.2.0"
description = "Local, auditable engineering workflow runtime for Codex"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=2,<3",
  "packaging>=24,<27",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.scripts]
codex-os = "codex_ai_os.cli.app:main"

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "build>=1.3,<2",
  "detect-secrets>=1.5,<2",
  "fastapi>=0.141.1,<0.142",
  "hatchling>=1.27,<2",
  "httpx>=0.28.1,<0.29",
  "pip-audit>=2.9,<3",
  "pyright[nodejs]>=1.1.403,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_ai_os"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "codex_ai_os/resources/profiles"
"gates" = "codex_ai_os/resources/gates"
"THIRD_PARTY_NOTICES.md" = "codex_ai_os/resources/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "real_oci: opt-in integration tests that require a running local OCI engine and pre-pulled locked image",
]

[tool.coverage.run]
branch = true
source = ["codex_ai_os"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/codex_ai_os/templates/*.py" = ["E501", "RUF001"]
"src/codex_ai_os/pilots/*.py" = ["E501", "RUF001"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.uv]
package = true
