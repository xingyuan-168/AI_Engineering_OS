schema_version: '1.2'
environment_mode: oci-first
oci_backend: podman
compose_files: [compose.yaml]
dockerfiles: [docker/ai-os.Dockerfile]
dependency_locks: [uv.lock]
services:
  - name: runtime
    dockerfile: docker/ai-os.Dockerfile
    smoke_command: [python, -c, "import codex_ai_os"]
persistent_mounts: []
shared_assets: []
host_budget:
  max_project_bytes: 2147483648
  max_git_bytes: 1073741824
  large_file_bytes: 52428800
