schema_version: "1.2"
name: frontend-project
description: Add product, interaction, UI, accessibility, and frontend verification evidence.
project_types: [frontend, fullstack]
additional_skills: [product-design, interaction-design, ui-design, html-prototype, frontend-implementation, testing]
required_artifacts:
  - docs/PRODUCT_DESIGN.md
  - docs/INTERACTION_DESIGN.md
  - docs/UI_DESIGN.md
  - docs/TEST_PLAN.md
additional_reviewers: [qa, reviewer]
min_agents: 3
approval_required: false
task_templates:
  - key: frontend-implementation
    agent: frontend-engineer
    skill: frontend-implementation
    prompt: Implement the approved accessible frontend slice.
    impact_patterns:
      - src/codex_ai_os/frontend/**
      - tests/frontend/**
gate_requirements:
  - gate: G2
    artifacts:
      - docs/PRODUCT_DESIGN.md
      - docs/INTERACTION_DESIGN.md
      - docs/UI_DESIGN.md
    artifact_types:
      - html-prototype
    checks:
      - html-prototype-validator
    reviews:
      - ux-prototype
